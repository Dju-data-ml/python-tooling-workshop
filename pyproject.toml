[project]
name = "python-tooling-workshop"
version = "0.1.0"
description = "Workshop pratique pour maîtriser les outils Python en production"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
    "click>=8.1.7",
]

[dependency-groups]
dev = [
    "ruff>=0.1.9",
]

[tool.ruff]
# Line length to match Black's default
line-length = 100

# Target Python 3.10+
target-version = "py310"

# Directories to exclude from linting
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Rules to ignore
ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false
